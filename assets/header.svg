<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#140d2e"/>
      <stop offset="100%" stop-color="#06202e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .edge  { stroke:#3b3f6b; stroke-width:1; opacity:.55 }
    .pulse { stroke:#22d3ee; stroke-width:2; stroke-linecap:round; stroke-dasharray:14 1000;
              stroke-dashoffset:14; opacity:.9; animation:flow 3s linear infinite }
    .node  { fill:#c4b5fd; animation:beat 2.4s ease-in-out infinite }
    .halo  { fill:#8b5cf6; opacity:.18; transform-box:fill-box; transform-origin:center;
              animation:halo 2.4s ease-in-out infinite }
    .star  { fill:#ffffff; opacity:.15; animation:twinkle 4s ease-in-out infinite }
    .cursor{ animation:blink 1s step-end infinite }
    .float { animation:float 7s ease-in-out infinite }
    @keyframes flow    { to { stroke-dashoffset:-280 } }
    @keyframes beat    { 0%,100% { fill:#c4b5fd } 50% { fill:#22d3ee } }
    @keyframes halo    { 0%,100% { transform:scale(.7); opacity:.08 } 50% { transform:scale(1.25); opacity:.28 } }
    @keyframes twinkle { 0%,100% { opacity:.08 } 50% { opacity:.55 } }
    @keyframes blink   { 50% { opacity:0 } }
    @keyframes float   { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-10px) } }
  </style>
